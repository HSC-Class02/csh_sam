name: Update and deploy Samsung Electronics dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - "scripts/**"
      - "dashboard/index.html"
      - "requirements.txt"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: samsung-financial-dashboard
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Collect and analyze OpenDART data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY || secrets.OPENDART_API_KEY }}
        run: python scripts/update.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json data/processed/latest.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh Samsung Electronics financial data"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
